name = "colegio-nos-leads"
main = "src/index.js"
compatibility_date = "2026-09-15"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://matriculas.colegionos.com,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "colegio-nos-leads"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["*/5 * * * *"]
